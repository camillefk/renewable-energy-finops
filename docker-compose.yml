version: '3.8'

services:
  # PostgreSQL - Metadados do Airflow
  postgres:
    image: postgres:15-alpine
    container_name: renewable-postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - renewable-network

  # Redis - Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: renewable-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - renewable-network

  # Airflow Webserver
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renewable-airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AIRFLOW_HOME: /airflow
      AIRFLOW__CORE__DAGS_FOLDER: /airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /airflow/plugins
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'True'
      GOOGLE_APPLICATION_CREDENTIALS: /airflow/gcp-key.json
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/airflow/dags
      - ./airflow/plugins:/airflow/plugins
      - ./airflow/logs:/airflow/logs
      - ./airflow/config:/airflow/config
      - ${HOME}/.config/gcloud/application_default_credentials.json:/airflow/gcp-key.json:ro
    command: >
      bash -c "airflow db upgrade && 
               airflow webserver"
    networks:
      - renewable-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Airflow Scheduler
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renewable-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    environment:
      AIRFLOW_HOME: /airflow
      AIRFLOW__CORE__DAGS_FOLDER: /airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /airflow/plugins
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      GOOGLE_APPLICATION_CREDENTIALS: /airflow/gcp-key.json
    volumes:
      - ./airflow/dags:/airflow/dags
      - ./airflow/plugins:/airflow/plugins
      - ./airflow/logs:/airflow/logs
      - ./airflow/config:/airflow/config
      - ${HOME}/.config/gcloud/application_default_credentials.json:/airflow/gcp-key.json:ro
    command: airflow scheduler
    networks:
      - renewable-network

  # Airflow Worker (Celery)
  airflow-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renewable-airflow-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AIRFLOW_HOME: /airflow
      AIRFLOW__CORE__DAGS_FOLDER: /airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /airflow/plugins
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
      GOOGLE_APPLICATION_CREDENTIALS: /airflow/gcp-key.json
    volumes:
      - ./airflow/dags:/airflow/dags
      - ./airflow/plugins:/airflow/plugins
      - ./airflow/logs:/airflow/logs
      - ./airflow/config:/airflow/config
      - ${HOME}/.config/gcloud/application_default_credentials.json:/airflow/gcp-key.json:ro
    command: airflow celery worker
    networks:
      - renewable-network

volumes:
  postgres_data:

networks:
  renewable-network:
    driver: bridge